# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/isaacus-dev/isaacus-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.' or 'packages/mcp-server'
        required: false
        default: ''

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_JSON=$(jq -nc --arg p "$INPUT_PATH" '[ $p ]')
          else
            PATHS_JSON=$(jq -nc '[".", "packages/mcp-server"]')
          fi
          DATA=$(jq -nc --argjson paths "$PATHS_JSON" '{paths_released: ($paths | tojson)}')
          yarn tsn scripts/publish-packages.ts "$DATA"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          NPM_TOKEN: ${{ secrets.ISAACUS_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Upload MCP Server DXT GitHub release asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            packages/mcp-server/isaacus_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
